<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart To-Do List - Priority & Due Date Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="todo-app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-icon">✓</div>
      <h2>Smart To-Do List</h2>
      <p class="subtitle">Organize tasks with priorities, due dates & local saving</p>
    </header>

    <!-- Task Creation Form -->
    <div class="create-task-card">
      <div class="input-row">
        <input type="text" id="task-input" placeholder="What needs to be done? *" autocomplete="off">
        <button id="add-btn" type="button">Add Task</button>
      </div>

      <div class="task-options-row">
        <!-- Priority Selector -->
        <div class="option-field">
          <label for="priority-select">Priority:</label>
          <select id="priority-select" class="custom-select">
            <option value="medium" selected>🟡 Medium</option>
            <option value="high">🔴 High</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>

        <!-- Category Selector -->
        <div class="option-field">
          <label for="category-select">Category:</label>
          <select id="category-select" class="custom-select">
            <option value="General" selected>General</option>
            <option value="Work">💼 Work</option>
            <option value="Personal">🏠 Personal</option>
            <option value="Study">📚 Study</option>
          </select>
        </div>

        <!-- Due Date -->
        <div class="option-field">
          <label for="due-date-input">Due Date:</label>
          <input type="date" id="due-date-input" class="date-input">
        </div>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="controls-card">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search tasks by keyword..." autocomplete="off">
        <button id="clear-search-btn" class="clear-search-btn hidden" title="Clear search">✕</button>
      </div>

      <div class="filter-bar">
        <div class="filters">
          <button class="filter-btn active" data-filter="all">All (<span id="count-all">0</span>)</button>
          <button class="filter-btn" data-filter="active">Active (<span id="count-active">0</span>)</button>
          <button class="filter-btn" data-filter="completed">Done (<span id="count-completed">0</span>)</button>
          <button class="filter-btn" data-filter="high">High (<span id="count-high">0</span>)</button>
        </div>
        <button id="clear-completed-btn" class="clear-completed-btn" title="Clear all completed tasks">Clear Done</button>
      </div>
    </div>

    <!-- Task List -->
    <ul id="task-list"></ul>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">📝</div>
      <p id="empty-text">No tasks found. Add a task above to get organized!</p>
    </div>

    <!-- Footer Backup & Export Controls -->
    <footer class="app-footer">
      <div class="backup-actions">
        <button id="export-btn" class="backup-btn" title="Download backup of all tasks">⬇ Export JSON</button>
        <label for="import-file" class="backup-btn import-label" title="Import tasks from backup JSON">
          ⬆ Import JSON
          <input type="file" id="import-file" accept=".json" class="hidden-file-input">
        </label>
      </div>
      <span id="storage-status" class="storage-status">Auto-saved to LocalStorage</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
